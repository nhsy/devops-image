name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '04 04 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  verify:
    name: base image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU and Buildx
        uses: ./.github/actions/buildx

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: base-image:latest
          target: base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: |
          docker run --rm base-image:latest sh -c " \
            git --version && \
            python3 --version && \
            terraform version && \
            kubectl version --client && \
            packer --version && \
            terragrunt --version && \
            tflint --version \
          "

  build:
    name: images
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:8}
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Resolve whether to push
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          # act builds and tests; it never publishes. A hard stop rather than
          # relying on the ref, so no local invocation can authenticate to
          # Docker Hub or write a tag.
          if [ "${ACT:-}" = "true" ]; then
            echo "push=false" >>"$GITHUB_OUTPUT"
          # Keyed on the REF, not the event. github.event_name is "push" for a
          # branch push too, so testing the event would publish from anywhere
          # the workflow happens to run; refs/heads/main covers the push,
          # schedule and workflow_dispatch cases and nothing else. A pull
          # request is refs/pull/N/merge and so never matches.
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "push=true" >>"$GITHUB_OUTPUT"
          else
            echo "push=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU and Buildx
        uses: ./.github/actions/buildx

      - name: Build and push - gcp-devops
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.mode.outputs.push }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/gcp-devops-image:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/gcp-devops-image:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: gcp-devops

      - name: Build and push - aws-devops
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.mode.outputs.push }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/aws-devops-image:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/aws-devops-image:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: aws-devops
