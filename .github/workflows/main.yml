name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '04 04 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes anything back to the repository; publishing uses a Docker
# Hub token, not GITHUB_TOKEN. Declared explicitly so the workflow does not
# inherit whatever the repository default happens to be.
permissions:
  contents: read

jobs:

  verify:
    name: verify base image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: ./.github/actions/buildx
        with:
          # This job builds one platform and loads it locally, so QEMU would be
          # set up and never used.
          qemu: 'false'

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: base-image:latest
          target: base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        shell: bash
        run: |
          set -euo pipefail
          # The same script the image build runs, shipped to /usr/local/bin by
          # the Dockerfile. Inlining the list here is what let CI and the image
          # drift onto different tool sets.
          docker run --rm base-image:latest /usr/local/bin/verify-installation.sh

  build:
    name: build and push images
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Read from the environment rather than a template expression. Those
          # are substituted into the script text before bash parses it -
          # harmless for a commit sha, but it is the shape that becomes an
          # injection the day the value is something a contributor controls.
          echo "tag=${GITHUB_SHA:0:8}" >>"$GITHUB_OUTPUT"

      - name: Resolve whether to push
        id: mode
        shell: bash
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail
          # act builds and tests; it never publishes. A hard stop rather than
          # relying on the ref, so no local invocation can authenticate to
          # Docker Hub or write a tag.
          if [ "${ACT:-}" = "true" ]; then
            push=false
          # Keyed on the REF, not the event. github.event_name is "push" for a
          # branch push too, so testing the event would publish from anywhere
          # the workflow happens to run; refs/heads/main covers the push,
          # schedule and workflow_dispatch cases and nothing else. A pull
          # request is refs/pull/N/merge and so never matches.
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            push=true
          else
            push=false
          fi
          echo "push=$push" >>"$GITHUB_OUTPUT"

          # Both build steps put this namespace in their tags whether or not we
          # push, and buildx parses --tag either way. Where the secret is absent
          # - under act, and on a fork PR - an empty namespace renders
          # "/gcp-devops-image:latest", which is not a valid reference, so the
          # build fails before it starts. Neither of those paths publishes, so a
          # placeholder is enough to keep the build itself exercisable.
          if [ "$push" = "true" ] && [ -z "${DOCKER_HUB_USERNAME:-}" ]; then
            echo "Resolved push=true but DOCKER_HUB_USERNAME is unset." >&2
            exit 1
          fi
          echo "namespace=${DOCKER_HUB_USERNAME:-local}" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU and Buildx
        uses: ./.github/actions/buildx

      - name: Login to Docker Hub
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push - gcp-devops
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.mode.outputs.push }}
          tags: |
            ${{ steps.mode.outputs.namespace }}/gcp-devops-image:latest
            ${{ steps.mode.outputs.namespace }}/gcp-devops-image:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: gcp-devops

      - name: Build and push - aws-devops
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.mode.outputs.push }}
          tags: |
            ${{ steps.mode.outputs.namespace }}/aws-devops-image:latest
            ${{ steps.mode.outputs.namespace }}/aws-devops-image:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: aws-devops
