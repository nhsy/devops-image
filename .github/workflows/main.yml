name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '04 04 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test_dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: base-image:latest
          target: base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: |
          docker run --rm base-image:latest sh -c " \
            git --version && \
            python3 --version && \
            terraform version && \
            kubectl version --client && \
            packer --version && \
            terragrunt --version && \
            tflint --version \
          "

  build:
    needs: test_dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:8}
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push - gcp-devops
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/gcp-devops-image:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/gcp-devops-image:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: gcp-devops

      - name: Build and push - aws-devops
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/aws-devops-image:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/aws-devops-image:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: aws-devops

      - name: Cleanup old tags
        if: success() && github.event_name != 'pull_request'
        run: |
          export DOCKERHUB_USERNAME="${{ secrets.DOCKER_HUB_USERNAME }}"
          export DOCKERHUB_TOKEN="${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}"
          ./scripts/cleanup-docker-hub.sh "${{ secrets.DOCKER_HUB_USERNAME }}" gcp-devops-image 5
          ./scripts/cleanup-docker-hub.sh "${{ secrets.DOCKER_HUB_USERNAME }}" aws-devops-image 5
