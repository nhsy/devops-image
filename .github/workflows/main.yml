name: Docker Build and Push

# Pushes and pull requests build only when something that goes into the images,
# or into building them, changed. An allowlist rather than paths-ignore, so a new
# docs or tooling file never triggers a ~10 minute build by default. lint.yml
# runs on every change. The schedule and manual runs have no path filter.
on:
  push:
    branches: [ "main" ]
    paths:
      - Dockerfile
      - .dockerignore
      - aqua.yaml
      - scripts/**
      - .github/workflows/main.yml
      - .github/actions/**
  pull_request:
    branches: [ "main" ]
    # Same list as push above; keep the two in step.
    paths:
      - Dockerfile
      - .dockerignore
      - aqua.yaml
      - scripts/**
      - .github/workflows/main.yml
      - .github/actions/**
  workflow_dispatch:
  schedule:
    - cron: '04 04 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the build and merge jobs, which publish to GHCR
# with GITHUB_TOKEN, are granted packages: write. Declared explicitly so the
# workflow does not inherit whatever the repository default happens to be.
permissions:
  contents: read

# Caching: every build writes its own gha cache scope. They used to share the
# default scope, and each cache-to replaces the scope's index, so every build
# overwrote the one before it and the arm64 base and the cloud CLI layers were
# rebuilt on every run.
#
# Freshness: the weekly schedule builds with no-cache, so the @latest AI CLIs
# and apt updates are picked up even when nothing in the repository changed.
# Pushes and pull requests reuse the cache.

jobs:

  verify:
    name: verify base image
    runs-on: ubuntu-latest
    # security-events: write uploads the Trivy SARIF to code scanning.
    permissions:
      contents: read
      security-events: write
    outputs:
      push: ${{ steps.mode.outputs.push }}
      namespace: ${{ steps.mode.outputs.namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Resolved once here so the build matrix and the merge job agree on it.
      - name: Resolve whether to push
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          # act builds and tests; it never publishes. A hard stop rather than
          # relying on the ref, so no local invocation can authenticate to
          # GHCR or write a tag.
          if [ "${ACT:-}" = "true" ]; then
            push=false
          # Keyed on the REF, not the event. github.event_name is "push" for a
          # branch push too, so testing the event would publish from anywhere
          # the workflow happens to run; refs/heads/main covers the push,
          # schedule and workflow_dispatch cases and nothing else. A pull
          # request is refs/pull/N/merge and so never matches.
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            push=true
          else
            push=false
          fi
          echo "push=$push" >>"$GITHUB_OUTPUT"

          # Image references must be lowercase and owner names need not be.
          # GITHUB_REPOSITORY_OWNER is always set, including under act, so the
          # references stay valid on paths that never push.
          echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: ./.github/actions/buildx

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: base-image:latest
          target: base
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,scope=base-amd64,mode=max

      - name: Run tests in container
        shell: bash
        run: |
          set -euo pipefail
          # The same script the image build runs, shipped to /usr/local/bin by
          # the Dockerfile. Inlining the list here is what let CI and the image
          # drift onto different tool sets.
          docker run --rm base-image:latest /usr/local/bin/verify-installation.sh

      # Reports HIGH and CRITICAL; only the gate step below fails the build.
      # Pinned by commit, not tag:
      # trivy-action's tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23).
      - name: Scan base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: base-image:latest
          version: v0.76.2
          format: sarif
          output: trivy-base.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # Second pass reads the cached DB and binary; it only renders the table.
      - name: Summarise scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: base-image:latest
          version: v0.76.2
          skip-setup-trivy: true
          format: table
          output: trivy-base.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Write scan summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Trivy: base image (HIGH, CRITICAL, fixable)'
            echo '```'
            cat trivy-base.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # act has no code scanning endpoint.
      - name: Upload scan to code scanning
        if: ${{ !github.event.act }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-base.sarif
          category: trivy-base

      # Last, so the report and upload above happen even when this fails.
      # Unfixed CVEs are ignored: there is nothing to act on until a fix ships.
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: base-image:latest
          version: v0.76.2
          skip-setup-trivy: true
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # One job per image and platform, each on a runner of that architecture, so
  # arm64 builds natively instead of under QEMU and all four run at once. On
  # main each job pushes its single-platform image by digest only; the merge
  # job below puts the tags on.
  build:
    name: build ${{ matrix.image }}-devops (${{ matrix.arch }})
    needs: verify
    # Never under act: four full image builds don't fit on a dev machine, and
    # two of them need arm runners act can't provide. .actrc passes an event
    # payload with "act": true; on GitHub the field is absent.
    if: ${{ !github.event.act }}
    runs-on: ${{ matrix.runner }}
    # security-events: write uploads the Trivy SARIF (amd64 legs on main).
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        image: [gcp, aws]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: ./.github/actions/buildx

      - name: Login to GHCR
        if: needs.verify.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build output
        id: output
        shell: bash
        env:
          PUSH: ${{ needs.verify.outputs.push }}
          IMAGE: ${{ needs.verify.outputs.namespace }}/${{ matrix.image }}-devops-image
        run: |
          set -euo pipefail
          # On main, push the single-platform image by digest only; the merge
          # job tags it. Otherwise build into the cache only: nothing is pushed
          # or loaded.
          if [ "$PUSH" = "true" ]; then
            echo "outputs=type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" >>"$GITHUB_OUTPUT"
          else
            echo "outputs=type=cacheonly" >>"$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: ${{ matrix.image }}-devops
          # Links the GHCR package to this repository, which is what lets this
          # repository's GITHUB_TOKEN push to it and prune it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: ${{ steps.output.outputs.outputs }}
          no-cache: ${{ github.event_name == 'schedule' }}
          # The amd64 legs also read the verify job's scope, which holds the
          # base layers they share with it.
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
            type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      # Scan the digest just pushed, before the merge job tags it: a failed
      # gate below fails this job, merge never runs and :latest stays on the
      # last good image. amd64 only; arm64 carries the same tool versions.
      # image-src remote reads the layers over the registry API (using the
      # login above), so nothing is pulled into docker.
      - name: Scan image
        if: needs.verify.outputs.push == 'true' && matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ needs.verify.outputs.namespace }}/${{ matrix.image }}-devops-image@${{ steps.build.outputs.digest }}
          version: v0.76.2
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Summarise scan
        if: needs.verify.outputs.push == 'true' && matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ needs.verify.outputs.namespace }}/${{ matrix.image }}-devops-image@${{ steps.build.outputs.digest }}
          version: v0.76.2
          skip-setup-trivy: true
          format: table
          output: trivy.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Write scan summary
        if: needs.verify.outputs.push == 'true' && matrix.arch == 'amd64'
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}-devops-image
        run: |
          set -euo pipefail
          {
            echo "### Trivy: ${IMAGE} (HIGH, CRITICAL, fixable)"
            echo '```'
            cat trivy.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload scan to code scanning
        if: needs.verify.outputs.push == 'true' && matrix.arch == 'amd64'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}

      - name: Fail on fixable critical vulnerabilities
        if: needs.verify.outputs.push == 'true' && matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ needs.verify.outputs.namespace }}/${{ matrix.image }}-devops-image@${{ steps.build.outputs.digest }}
          version: v0.76.2
          skip-setup-trivy: true
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Export digest
        if: needs.verify.outputs.push == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.verify.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines each image's two platform digests into one multi-arch tag.
  merge:
    name: publish ${{ matrix.image }}-devops
    needs: [verify, build]
    if: needs.verify.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [gcp, aws]

    steps:
      # Only for the local buildx action below.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Buildx
        uses: ./.github/actions/buildx

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch tags
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.verify.outputs.namespace }}/${{ matrix.image }}-devops-image
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          # Read from the environment rather than a template expression, so the
          # values are never substituted into the script text.
          tag="${GITHUB_SHA:0:8}"
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, found ${#refs[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${tag}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${tag}"
