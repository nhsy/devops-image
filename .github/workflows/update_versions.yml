name: Update Software Versions

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * 1' # Runs every Monday at 02:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update_and_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update aqua.yaml versions
        run: bash scripts/update-aqua-versions.sh

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump aqua tool versions"
          branch: "chore/update-aqua-versions-${{ github.run_id }}"
          delete-branch: true
          title: "chore: bump aqua tool versions"
          body: |
            Automated weekly check found updated versions in `aqua.yaml`.

            Please review and merge.

  build_and_test_image:
    needs: update_and_pr
    if: ${{ needs.update_and_pr.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.update_and_pr.outputs.pr_number }}/head

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: base:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: base

      - name: Build gcp-devops
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: gcp-devops:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: gcp-devops

      - name: Build aws-devops
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: aws-devops:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: aws-devops

      - name: Run tests in container
        run: |
          docker run --rm base:test sh -c " \
            git --version && \
            python3 --version && \
            terraform version && \
            kubectl version --client && \
            packer --version && \
            terragrunt --version && \
            tflint --version \
          "
