# Shared Buildx setup. Every job in main.yml needs buildx, and keeping it in one
# place means an action bump is one edit rather than one per job - the kind of
# drift that left this repo on node20 actions in some places and not others.
#
# No QEMU: each build job runs on a runner of the architecture it builds.
name: buildx
description: Set up Docker Buildx

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
