version: '3'

vars:
  BASE_IMAGE: devops-base
  GCP_IMAGE: gcp-devops
  AWS_IMAGE: aws-devops

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Check required tooling is present
    cmds:
      - docker --version
      - docker buildx version
      - pre-commit --version
      # act is only needed for the ci:* tasks, so warn rather than fail: someone
      # who only wants `task build:gcp` should not be blocked by it.
      - >-
        command -v act >/dev/null && act --version
        || echo "act not installed (optional - only for task ci:list / ci:local / ci:image)"
    silent: true

  build:base:
    desc: Build the base image stage (the one CI tests)
    cmds:
      - docker build --pull --force-rm --tag {{.BASE_IMAGE}} --target base .

  build:gcp:
    desc: Build GCP DevOps image
    cmds:
      - docker build --pull --force-rm --no-cache --tag {{.GCP_IMAGE}} --target gcp-devops .

  build:aws:
    desc: Build AWS DevOps image
    cmds:
      - docker build --pull --force-rm --no-cache --tag {{.AWS_IMAGE}} --target aws-devops .

  build:all:
    desc: Build all DevOps images
    cmds:
      - task: build:gcp
      - task: build:aws

  test:base:
    desc: Test the base image stage, the same checks CI runs
    cmds:
      # No `sh -c` wrapper, unlike test:gcp and test:aws: the base stage sets
      # no ENTRYPOINT, so the script is the command.
      - docker run --rm {{.BASE_IMAGE}} /usr/local/bin/verify-installation.sh

  test:gcp:
    desc: Test GCP DevOps image
    cmds:
      # ENTRYPOINT is zsh, so -c is consumed by the shell rather than docker.
      # The shared script covers the base tools; only the cloud CLI is extra.
      - |
        docker run --rm {{.GCP_IMAGE}} -c " \
          /usr/local/bin/verify-installation.sh && \
          gcloud version \
        "

  test:aws:
    desc: Test AWS DevOps image
    cmds:
      # ENTRYPOINT is zsh, so -c is consumed by the shell rather than docker.
      # The shared script covers the base tools; only the cloud CLI is extra.
      - |
        docker run --rm {{.AWS_IMAGE}} -c " \
          /usr/local/bin/verify-installation.sh && \
          aws --version \
        "

  test:all:
    desc: Test all DevOps images
    cmds:
      - task: test:gcp
      - task: test:aws

  test:ci:
    desc: Run the verification CI runs, locally and without docker-in-docker
    cmds:
      - task: lint
      - task: build:base
      - task: test:base

  ci:list:
    desc: List the CI jobs act resolves from the workflow
    cmds:
      - act -l -W .github/workflows/main.yml

  ci:local:
    desc: Run the CI verify job under act - builds and tests the base stage
    cmds:
      - act push -W .github/workflows/main.yml -j verify

  ci:image:
    desc: Run the CI build job under act - builds both targets, never publishes
    cmds:
      # -j still runs the job's `needs`, so this is verify then the
      # image build. Slow: the build steps are linux/amd64,linux/arm64 and arm64
      # goes through QEMU. The workflow hard-disables publishing whenever ACT is
      # set, so this cannot reach Docker Hub.
      - act push -W .github/workflows/main.yml -j build

  lint:
    desc: Run pre-commit hooks on all files
    cmds:
      - pre-commit run --all-files

  clean:
    desc: Remove built images
    cmds:
      - docker rmi {{.BASE_IMAGE}} || true
      - docker rmi {{.GCP_IMAGE}} || true
      - docker rmi {{.AWS_IMAGE}} || true

  clean:dockerhub:
    desc: Purge old Docker Hub image tags, keeping the N most recent (default 5). Set DRY_RUN=true to preview
    dotenv: [.env]
    usage: task clean:dockerhub -- <namespace> <repository> [keep_count]
    cmds:
      - |
        if [[ -z "${DOCKERHUB_USERNAME:-}" ]] || [[ -z "${DOCKERHUB_TOKEN:-}" ]]; then
          echo "Error: Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN environment variables"
          exit 1
        fi
        ./scripts/cleanup-docker-hub.sh {{.CLI_ARGS}}
    requires:
      vars:
        - CLI_ARGS
