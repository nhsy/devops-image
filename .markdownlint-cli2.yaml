# Markdown style for README.md, AGENTS.md and the like.
config:
  # Prose wraps at 120 columns; code blocks and tables can run longer.
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
ignores:
  # A one-line @AGENTS.md import, not a document.
  - CLAUDE.md
  # Working notes and scratch output, not published docs.
  - .plans/**
  - .tmp/**
